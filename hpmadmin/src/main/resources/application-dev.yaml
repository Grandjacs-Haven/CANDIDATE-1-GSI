server:
  port: 8081

spring:
  profiles:
    active: dev
  application:
    name: XproGateway

  # --- DATABASE CONFIGURATION ---
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:appCanvas}?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  # --- ASYNC & DOCKER ---
  docker:
    compose:
      enabled: true
      file: docker-compose.local.yml
      lifecycle-management: start-and-stop
      readiness:
        wait: always
  task:
    execution:
      pool:
        core-size: 2
        max-size: 5

# --- MANAGEMENT & MONITORING (Actuator) ---
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,mappings"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

# --- LOGGING ---
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: info
    com.hospital.hpmadmin: debug
    org.springframework.web: debug
    org.springframework.security: debug
    org.springframework.orm.jpa: debug
    org.hibernate.orm.jdbc.bind: trace

Xpro:
  security:
    system-secret: ${SYSTEM_SECRET}
    jwt:
      secret: ${SYSTEM_SECRET}
      expiration: 9000000

      gateway:
        security:
          app-domain-rules:
            ADMIN_PORTAL:
              - "xpro.com"
            INTERNAL_OPS:
              - "xpro.com"
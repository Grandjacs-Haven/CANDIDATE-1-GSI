server:
  port: 8083

spring:
  application:
    name: hpmAdmin


  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hpm}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

  docker:
    compose:
      enabled: false

  task:
    execution:
      pool:
        core-size: 2
        max-size: 5

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus,mappings"
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  level:
    root: INFO
    com.hospital.hpmadmin: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.orm.jpa: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

xpro:
  security:
    system-secret: ${SYSTEM_SECRET}
    jwt:
      secret: ${SYSTEM_SECRET}
      expiration: 9000000
      gateway:
        app-domain-rules:
          - "xpro.com"